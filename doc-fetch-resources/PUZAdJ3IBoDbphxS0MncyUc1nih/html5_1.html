<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="ShizuSU 分层补丁模型架构图：顶层管理器、四张功能补丁、SukiSU 基线">
<title>ShizuSU 分层架构</title>
<style>
html,body{margin:0;padding:0;background:#ffffff}
.box{width:100%;max-width:820px;box-sizing:border-box;padding:8px}
svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="box">
<svg viewBox="0 0 980 420" role="img" aria-label="ShizuSU 分层架构图">
  <rect x="40" y="40" width="900" height="54" rx="10" fill="#e0f2fe" stroke="#0e7490"/>
  <text x="60" y="62" font-size="13" font-weight="bold" fill="#155e75">顶层 · ShizuSU 管理器</text>
  <text x="60" y="80" font-size="11.5" fill="#075985">基于 SukiSU 管理器（com.sukisu.ultra → 自有包名）+ 增量：备份/恢复、批量安装、hosts 隐藏入口、隐身开关、SuSFS 控制页</text>
  <rect x="40" y="112" width="440" height="64" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="60" y="134" font-size="12.5" font-weight="bold" fill="#166534">补丁 1 · 多管理器（ReSukiSU 移植）</text>
  <text x="60" y="152" font-size="11" fill="#166534">manager_sign.h 多签名表 · apk_sign.c 遍历 · dynamic_manager 热注册</text>
  <text x="60" y="168" font-size="11" fill="#166534">CONFIG_KSU_MULTI_MANAGER_SUPPORT · track_throne 即时同步</text>
  <rect x="500" y="112" width="440" height="64" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="520" y="134" font-size="12.5" font-weight="bold" fill="#166534">补丁 2 · 内核隐身（7kimisu 移植）</text>
  <text x="520" y="152" font-size="11" fill="#166534">kernel/manager/stealth.c · GET_INFO 门控 · 拨号密令安全阀</text>
  <text x="520" y="168" font-size="11" fill="#166534">状态 /data/adb/shizusu/stealth · 与多管理器正交</text>
  <rect x="40" y="194" width="440" height="64" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="60" y="216" font-size="12.5" font-weight="bold" fill="#166534">补丁 3 · 模块管理便利（Next 移植）</text>
  <text x="60" y="234" font-size="11" fill="#166534">module.rs 函数集（备份/恢复/批量/镜像/hosts）+ BackupRestore.kt</text>
  <text x="60" y="250" font-size="11" fill="#166534">ksud CLI 扩展 · 稀疏镜像大小可调</text>
  <rect x="500" y="194" width="440" height="64" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="520" y="216" font-size="12.5" font-weight="bold" fill="#166534">补丁 4 · 隐藏增强（Next 移植）</text>
  <text x="520" y="234" font-size="11" fill="#166534">susfsd（reboot-syscall 通道）· KPROBES 钩子隐藏 · App Profile hosts</text>
  <text x="520" y="250" font-size="11" fill="#166534">与 SukiSU 内置 susfs 管理合并为统一页面</text>
  <rect x="40" y="290" width="900" height="86" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="60" y="312" font-size="13" font-weight="bold" fill="#334155">底层 · SukiSU-Ultra 基线（内核 + ksud + 管理器）</text>
  <text x="60" y="330" font-size="11.5" fill="#475569">内核：KPM（CONFIG_KPM=y）· Magic Mount 兼容层 · metamodule · App Profile · non-GKI 3.x backport · 官方钩子</text>
  <text x="60" y="346" font-size="11.5" fill="#475569">用户态：ksud（Rust）· 管理器（内置 susfs 管理界面 com.sukisu.ultra.ui.screen.susfs）</text>
  <text x="60" y="362" font-size="11.5" fill="#475569">签名：EXPECTED_SIZE/HASH（Kbuild 可覆盖）→ 移植后由多签名表接管</text>
  <text x="490" y="402" font-size="12" fill="#5b6b78" text-anchor="middle">每层独立维护 · 同步上游顺序：SukiSU main → 补丁1 → 补丁2 → 补丁3 → 补丁4</text>
</svg>
</div>
</body>
</html>
