name: xposed-mirror

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch modules.json
        run: |
          set -e
          ok=0
          # Primary: official backup source (same as ShizuSU-Xposed, full OnlineModule fields)
          echo "== trying backup source"
          if curl -fkSL --compressed --max-time 90 -A "Mozilla/5.0 (compatible; ShizuSU-mirror/1.0)" "https://backup.modules.lsposed.org/modules.json" -o "docs/xposed/modules.json" 2>/dev/null; then
            ok=1
          fi
          # Fallback 1: official website paginated API (merge all pages)
          if [ "$ok" != "1" ]; then
            rm -f docs/xposed/modules.json
            for p in $(seq 1 60); do
              u="https://modules.lsposed.org/module-list/$p.json"
              echo "== trying $u"
              if curl -fkSL --compressed --max-time 60 -A "Mozilla/5.0 (compatible; ShizuSU-mirror/1.0)" "$u" -o "docs/xposed/page-$p.json" 2>/dev/null; then
                ok=1
              else
                break
              fi
            done
            if [ "$ok" = "1" ]; then
              python3 - <<'PYEOF'
              import json, glob, os, re
              modules = []
              for f in sorted(glob.glob('docs/xposed/page-*.json'), key=lambda p: int(re.findall(r'page-(\d+)\.json', p)[0])):
                  try:
                      data = json.load(open(f, encoding='utf-8'))
                      modules.extend(data.get('modules', []))
                  except Exception as e:
                      print('skip', os.path.basename(f), e)
                  os.remove(f)
              json.dump(modules, open('docs/xposed/modules.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
              print('entries:', len(modules))
              PYEOF
            fi
          fi
          # Fallback 2: old primary endpoint (currently dead upstream, kept for resilience)
          if [ "$ok" != "1" ]; then
            echo "== fallback trying modules.lsposed.org"
            if curl -fkSL --compressed --max-time 60 -A "Mozilla/5.0 (compatible; ShizuSU-mirror/1.0)" "https://modules.lsposed.org/modules.json" -o "docs/xposed/modules.json" 2>/dev/null; then
              ok=1
            fi
          fi
          if [ "$ok" != "1" ]; then
            echo "::error::all upstream mirrors failed"
            exit 1
          fi
          # basic sanity: must be a non-empty JSON array
          python3 - <<'PYEOF'
          import json
          d = json.load(open('docs/xposed/modules.json', encoding='utf-8'))
          assert isinstance(d, list), 'not an array'
          assert len(d) > 0, 'empty module list'
          print('final entries:', len(d))
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/xposed/modules.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(xposed-mirror): refresh modules.json [skip ci]"
            git push
          fi
