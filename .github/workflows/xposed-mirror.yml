name: xposed-mirror

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch modules.json
        run: |
          set -e
          python3 .github/scripts/xposed_mirror_fetch.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/xposed/modules.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(xposed-mirror): refresh modules.json [skip ci]"
            git push
          fi
